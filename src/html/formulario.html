<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="../css/style.css?v=1">
    <title>Seleção Dango</title>
</head>
<body class="index">
    <header>
        <h1>Kamura Dango</h1>
        <nav>
            <a href="../../index.html">início</a>
            <a href="formulario.html"> seleção</a>
        </nav>
    </header>
    <br>

    <main class="formulario">
        <form action="../php/formulario.php" method="post">

            <fieldset>
                <legend><strong>Dados pessoais</strong></legend>
                <br>
                <div>
                    <label for="idnome">Nome completo</label>
                    <br>
                    <input type="text" name="nome" id="idnome" placeholder="Nome completo" required>
                </div>
                <br>
                <div>
                    <label for="idmail">Email</label>
                    <br>
                    <input type="email" name="email" id="idmail" placeholder="beltrano@gmail.com" required>
                </div>
                <br>
                <div>
                    <label for="ididade">Idade</label>
                    <br>
                    <input type="number" name="idade" id="ididade" min="18" required>
                </div>
            </fieldset>

            <br>

            <fieldset>
                <legend><strong>Seleção Dango</strong></legend>
                <br>
                <div>
                    <label for="iddango">Selecione o seu Dango</label>
                    <input type="text" name="dango" id="iddango" list="dangodango">
                    <datalist id="dangodango">
                        <option value="Dango the Kamura"></option>
                        <option value="Dango Afiado"></option>
                        <option value="Dango Doçura"></option>
                        <option value="Dango Dia de Perna"></option>
                        <option value="Dango Equilíbrio"></option>
                        <option value="Dango Pessegabil"></option>
                    </datalist>

                </div>
                <br>
                <div>
                    <label for="idnumero">Quantidade de Dangos</label>
                    <input type="number" name="numDangos" id="idnumero" min="1" max="3">
                </div>
                <br>
            </fieldset>

            <br>

            <!--BOTÕES DE FINALIZAÇÃO-->
            <button type="submit" class="dangoBotaoazul">Finalizar pedido</button>

            <a href="../../index.html">
                <button type="button" class="newpage">Voltar para o início</button>
            </a>

        </form>

        <script src="../js/script.js?v=2"></script>

    </main>
    
</body>
</html>
